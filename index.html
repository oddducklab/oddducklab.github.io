<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Odd Duck Lab — Independent Film Distribution</title>

    <meta
        name="description"
        content="Odd Duck Lab — Independent film distribution. Curating cinematic oddities, beautiful anomalies, and boundary-pushing narratives."
    >

    <style>

        /* --------------------------------
           FONTS
        -------------------------------- */

        @font-face {
            font-family: "Inter";
            src: url("fonts/Inter-Regular.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Inter";
            src: url("fonts/Inter-Medium.woff2") format("woff2");
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "DM Mono";
            src: url("fonts/DMMono-Regular.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "DM Mono";
            src: url("fonts/DMMono-Medium.woff2") format("woff2");
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }


        /* --------------------------------
           VARIABLES
        -------------------------------- */

        :root {
            --black: #111111;
            --paper: #f1efe8;
            --accent: #d8ff3e;
        }


        /* --------------------------------
           RESET
        -------------------------------- */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: var(--black);
        }

        body {
            background: var(--black);
            color: var(--paper);
            font-family: "Inter", sans-serif;
        }


        /* --------------------------------
           CARD
        -------------------------------- */

        .card {
            min-height: 100vh;
            padding: 32px;
            padding-top: 0px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }


        /* --------------------------------
           MAIN
        -------------------------------- */

        main {
            max-width: 850px;
            margin: auto 0;
            padding: 5vh 0 8vh;
            padding-top: 0px;
        }

        h1 {
            font-size: clamp(58px, 11vw, 150px);
            line-height: 0.85;
            letter-spacing: -0.07em;
            font-weight: 500;
            max-width: 900px;
        }

        .subtitle {
            margin-top: 28px;

            font-family: "DM Mono", monospace;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .description {
            margin-top: 70px;
            max-width: 600px;

            font-size: clamp(20px, 2.5vw, 32px);
            line-height: 1.25;
            letter-spacing: -0.025em;
        }


        /* --------------------------------
           CONTACT BUTTON
        -------------------------------- */

        .contact {
            margin-top: 60px;
        }

        .contact a {
            position: relative;
            isolation: isolate;
            overflow: hidden;

            display: inline-flex;
            align-items: center;
            gap: 18px;

            padding: 15px 19px;

            color: #111111;
            background: var(--accent);

            border: 1px solid var(--accent);

            text-decoration: none;

            font-family: "DM Mono", monospace;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.08em;

            transition:
                transform 0.3s ease,
                background-color 0.3s ease,
                border-color 0.3s ease;
        }


        /* Subtle light / film texture */

        .contact a::before {
            content: "";

            position: absolute;
            z-index: -1;

            inset: -80%;

            background:
                radial-gradient(
                    ellipse at 30% 40%,
                    rgba(255, 255, 255, 0.28),
                    transparent 35%
                ),
                radial-gradient(
                    ellipse at 70% 60%,
                    rgba(255, 255, 255, 0.12),
                    transparent 40%
                );

            opacity: 0;
            transform: rotate(8deg);

            transition:
                opacity 0.4s ease,
                transform 0.7s ease;
        }


        /* Hover */

        .contact a:hover {
            color: #111111;
            background: #e3ff6b;
            border-color: #e3ff6b;

            transform: translateY(-3px);
        }

        .contact a:hover::before {
            opacity: 1;
            transform: rotate(8deg) translate(7%, -4%);
        }


        /* Arrow */

        .contact a span {
            font-size: 17px;
            line-height: 1;

            transition: transform 0.3s ease;
        }

        .contact a:hover span {
            transform: translateX(5px);
        }


        /* --------------------------------
           FOOTER
        -------------------------------- */

        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;

            font-family: "DM Mono", monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .coordinates {
            text-align: right;
        }


        /* --------------------------------
           MOBILE
        -------------------------------- */

        @media (max-width: 600px) {

            .card {
                padding: 22px;
            }

            main {
                padding: 5vh 0 8vh;
            }

            h1 {
                font-size: 19vw;
            }

            .subtitle {
                margin-top: 24px;
                font-size: 12px;
            }

            .description {
                margin-top: 45px;
                font-size: 21px;
            }

            .contact {
                margin-top: 45px;
            }

            .contact a {
                padding: 13px 16px;
                font-size: 12px;
            }

            footer {
                font-size: 9px;
            }
        }

    </style>
</head>


<body>

    <div class="card">

        <main>

            <h1>
                Odd<br>
                Duck<br>
                Lab
            </h1>


            <div class="subtitle">
                Independent Film Distribution
            </div>


            <p class="description">
                Curating the cinematic oddities, beautiful anomalies,
                and boundary-pushing narratives the world needs to see.
            </p>


            <div class="contact">

                <a href="mailto:info@oddducklab.com">
                    Start a conversation
                    <span>→</span>
                </a>

            </div>

        </main>


        <footer>

            <div>
                © 2026 Odd Duck Lab
            </div>

            <div class="coordinates">
                Berlin<br>
                Amsterdam
            </div>

        </footer>

    </div>

</body>
</html>
